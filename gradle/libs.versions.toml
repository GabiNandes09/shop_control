[versions]

converterScalars = "3.0.0"
kotlin = "2.3.10"
composeBom = "2026.06.01"

coreKtx = "1.17.0"
activityCompose = "1.11.0"

koin = "4.2.2"

retrofit = "3.0.0"
okhttp = "5.4.0"

serialization = "1.11.0"

room = "2.8.4"

cameraX = "1.6.1"

mlkitBarcode = "17.3.0"

workManager = "2.11.2"
navigation = "2.9.8"
jsoup = "1.22.2"

[libraries]

androidx-core = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }


androidx-material3 = { module = "androidx.compose.material3:material3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }


converter-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "converterScalars" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }


retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }


okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }


kotlin-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }


room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraX" }

camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }

camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }

camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }


mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }


workmanager = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }


navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

[plugins]

android-application = { id = "com.android.application", version = "8.13.1" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }